spring.application.name=claims-platform
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/claimsdb}
spring.datasource.username=${DATABASE_USERNAME:claims}
spring.datasource.password=${DATABASE_PASSWORD:claims_dev_only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
