services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: claimsdb
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims_dev_only
    ports: ["5432:5432"]
    volumes: [claims_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claimsdb"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  claims_data:
